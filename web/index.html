<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15161a" />
    <title>Convoke</title>
    <link rel="stylesheet" href="./pair.css" />
    <script src="./pair.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Convoke</h1>
      <p id="what">Pair your iPhone with Convoke on your Mac: on the Mac choose <b>Remote → Pair Device</b>, then in the Convoke app on the iPhone tap <b>Scan QR Code</b>.</p>
      <p><a id="open" class="button" hidden>Open in the Convoke app</a></p>
      <p class="note">Convoke is used from its iPhone app; there is no web version.</p>
    </main>
  </body>
</html>
