# Convoke's push service on tb-0-3 (bin/deploy-push). It holds the APNs key, so it runs in
# its own namespace, apart from the relay. Public route: push.cnvk.si (Cloudflare tunnel →
# traefik; added in the Cloudflare dashboard).
apiVersion: v1
kind: Namespace
metadata:
  name: convoke-push
  labels:
    app.kubernetes.io/name: convoke-push
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: convoke-push-hostpath
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
# Registrations (device tokens → push ids) and the push-id secret.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: convoke-push-data
spec:
  capacity: { storage: 1Gi }
  accessModes: ["ReadWriteOnce"]
  storageClassName: convoke-push-hostpath
  persistentVolumeReclaimPolicy: Retain
  hostPath: { path: /mnt/data/convoke-push, type: DirectoryOrCreate }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: convoke-push-data
  namespace: convoke-push
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: convoke-push-hostpath
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: convoke-push
  namespace: convoke-push
  labels:
    app.kubernetes.io/name: convoke-push
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: convoke-push }
  template:
    metadata:
      labels: { app.kubernetes.io/name: convoke-push }
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      imagePullSecrets:
        - name: registry-cred
      initContainers:
        - name: chown-data
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 65532:65532 /data && chmod 0700 /data"]
          volumeMounts: [{ name: data, mountPath: /data }]
          securityContext: { runAsUser: 0, allowPrivilegeEscalation: false }
      containers:
        - name: push
          # bin/deploy-push substitutes the commit's tag (git-<sha>) for :latest.
          image: 100.64.0.5:30500/convoke-push:latest
          imagePullPolicy: IfNotPresent
          env:
            # The APNs key (secret "apns": key.p8, key-id, team-id). Without it the
            # service registers devices but can't send.
            - name: APNS_KEY_ID
              valueFrom: { secretKeyRef: { name: apns, key: key-id, optional: true } }
            - name: APNS_TEAM_ID
              valueFrom: { secretKeyRef: { name: apns, key: team-id, optional: true } }
            - name: APNS_KEY_FILE
              value: /apns/key.p8
          args: []
          ports: [{ name: http, containerPort: 8080 }]
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: apns, mountPath: /apns, readOnly: true }
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 30 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: convoke-push-data }
        - name: apns
          secret: { secretName: apns, optional: true, items: [{ key: key.p8, path: key.p8 }] }
---
apiVersion: v1
kind: Service
metadata:
  name: convoke-push
  namespace: convoke-push
spec:
  selector: { app.kubernetes.io/name: convoke-push }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: convoke-push
  namespace: convoke-push
spec:
  ingressClassName: traefik
  rules:
    - host: push.cnvk.si
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: convoke-push, port: { number: 80 } } }
---
# In: traefik and this namespace (the deploy's health check). Out: DNS, and HTTPS to APNs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: convoke-push
  namespace: convoke-push
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: convoke-push }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { app.kubernetes.io/name: traefik }
        - podSelector: {}
      ports: [{ port: 8080 }]
  egress:
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - ports: [{ port: 443, protocol: TCP }]
